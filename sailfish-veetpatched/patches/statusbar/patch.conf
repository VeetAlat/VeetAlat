# StatusBar: a black bar over the notch in apps, with the time and status icons.
# Read (sourced) by the root helper; this file is root-owned, in /usr/share.
NAME="StatusBar"
DESCRIPTION="Masks the notch with a black bar while an app is open, showing the time and the status icons (battery, signal, Wi-Fi...). Phone upright only."
# The file changed, and a line it must have (so it's the file we expect).
TARGET="/usr/share/lipstick-jolla-home-qt5/layers/AppLayer.qml"
EXPECT="id: appLayer"
# block.qml goes in just before the file's last closing brace.
BLOCK="block.qml"
# What to restart for the change to show: the home screen.
RESTART="home"
