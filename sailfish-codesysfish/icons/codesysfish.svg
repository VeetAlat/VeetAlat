  <path d="M16 88 C 22 50, 60 38, 104 40 L 120 40 C 132 40, 138 50, 138 62 L 138 114 C 138 126, 132 136, 120 136 L 104 136 C 60 138, 22 126, 16 88 Z" fill="#3a4a57" stroke="#232e37" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- The screen with its code -->
  <rect x="44" y="62" width="82" height="54" rx="6" fill="#0f1a14" stroke="#232e37" stroke-width="2"/>
  <rect x="50" y="72" width="14" height="5" rx="2.5" fill="#ffcc66"/>
    <rect x="68" y="72" width="30" height="5" rx="2.5" fill="#2fbf71"/>
    <rect x="56" y="83" width="12" height="5" rx="2.5" fill="#ffcc66"/>
    <rect x="72" y="83" width="22" height="5" rx="2.5" fill="#2fbf71"/>
    <rect x="50" y="94" width="20" height="5" rx="2.5" fill="#ffcc66"/>
    <rect x="74" y="94" width="14" height="5" rx="2.5" fill="#2fbf71"/>
    <rect x="56" y="105" width="10" height="5" rx="2.5" fill="#ffcc66"/>
    <rect x="70" y="105" width="26" height="5" rx="2.5" fill="#2fbf71"/>
    <rect x="100" y="104" width="3" height="7" fill="#ffffff"/>
  <!-- Status LEDs: run, I/O, error -->
  <circle cx="58" cy="52" r="3.5" fill="#2fbf71"/>
  <circle cx="70" cy="52" r="3.5" fill="#ffcc33"/>
  <circle cx="82" cy="52" r="3.5" fill="#ff5a4f" fill-opacity="0.35"/>
